<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #000000;
      padding: 48px;
      line-height: 1.5;
    }
    .pdf-container {
      max-width: 100%;
      font-size: 12pt;
      background: #ffffff;
    }

    /* Encabezado con logo */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header .logo-img {
      height: 50px;          /* Ajusta según tu logo */
      width: auto;
      display: block;
      margin: 0 auto 8px auto;
    }
    .header .badge {
      font-size: 10pt;
      font-weight: 600;
      color: #000000;
      background: #e8e8e8;
      padding: 2px 14px;
      border-radius: 20px;
      display: inline-block;
    }
    .divider {
      border-top: 2px solid #1e3a8a;
      margin: 16px 0;
    }

    .client-info {
      margin-bottom: 16px;
    }
    .client-info p {
      margin: 4px 0;
    }
    .client-info strong {
      font-weight: 600;
      color: #000000;
    }

    .services-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 12pt;
    }

    .services-table th {
      background-color: #000000;
      color: #ffffff;
      font-weight: 600;
      padding: 8px 12px;
      text-align: left;
    }
    .services-table th:last-child {
      text-align: right;
    }

    .service-row td {
      background-color: #ffffff;
      padding: 8px 12px;
      vertical-align: top;
    }

    .service-name {
      font-weight: 700;
      color: #000000;
      display: block;
      margin-bottom: 4px;
    }

    .service-detail {
      font-size: 10pt;
      color: #f2f6fa;
      white-space: pre-wrap;
      word-wrap: break-word;
      background-color: #f2f6fa;
      padding: 6px 10px;
      border-radius: 4px;
      border-left: 3px solid #000000;
      margin-top: 4px;
      display: block;
    }

    .service-price {
      font-weight: 700;
      color: #000000;
      text-align: right;
      white-space: nowrap;
      display: block;
    }

    .total-row td {
      background-color: #ffffff;
      padding: 10px 12px;
      font-weight: 700;
      color: #000000;
      font-size: 14pt;
    }
    .total-row .total-label {
      text-align: left;
    }
    .total-row .total-value {
      text-align: right;
      white-space: nowrap;
    }

    .footer {
      margin-top: 40px;
      font-size: 9pt;
      color: #f2f6fa;
      border-top: 1px solid #d6d6d6;
      padding-top: 12px;
      text-align: center;
    }
    .footer p {
      margin: 2px 0;
    }

    @media print {
      body { padding: 0; }
      .pdf-container { margin: 0; }
    }
  </style>
</head>
<body>
<div class="pdf-container">
  <div class="header">
    <!-- LOGO -->
    <img src="/data/logo-lienxo.png" alt="Lienxo" class="logo-img" />
    <span class="badge">Cotización</span>
  </div>
  <div class="divider"></div>

  <div class="client-info">
    <p><strong>Cliente:</strong> {{clientName}}</p>
    <p><strong>Producto o servicio:</strong> {{productName}}</p>
    <p><strong>Fecha:</strong> {{date}}</p>
  </div>
  <div class="divider"></div>

  <table class="services-table">
    <thead>
      <tr>
        <th>Servicio</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody>
      {{servicesRows}}
      <tr class="total-row">
        <td class="total-label">Total</td>
        <td class="total-value">{{total}}</td>
      </tr>
    </tbody>
  </table>

  <div class="footer">
    <p>Esta cotización es válida por 30 días.</p>
    <p>powered by actols</p>
  </div>
</div>
</body>
</html>
