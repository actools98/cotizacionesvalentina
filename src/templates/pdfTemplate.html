<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
      padding: 48px; /* 0.5 pulgadas */
      line-height: 1.5;
    }
    .pdf-container {
      max-width: 100%;
      font-size: 12pt;
      background: #ffffff;
    }

    /* Encabezado */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 28pt;
      font-weight: 700;
      color: #1e3a8a;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .header .badge {
      font-size: 10pt;
      font-weight: 600;
      color: #1e3a8a;
      background: #dbeafe;
      padding: 2px 14px;
      border-radius: 20px;
      display: inline-block;
    }
    .divider {
      border-top: 2px solid #1e3a8a;
      margin: 16px 0;
    }

    .client-info {
      margin-bottom: 16px;
    }
    .client-info p {
      margin: 4px 0;
    }
    .client-info strong {
      font-weight: 600;
      color: #1e3a8a;
    }

    /* Tabla sin bordes */
    .services-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 12pt;
    }

    .services-table th {
      background-color: #1e3a8a;
      color: #ffffff;
      font-weight: 600;
      padding: 8px 12px;
      text-align: left;
    }
    .services-table th:last-child {
      text-align: right;
    }

    .service-row td {
      background-color: #ffffff;
      padding: 8px 12px;
      vertical-align: top;
    }

    .service-name {
      font-weight: 700;
      color: #1e3a8a;
      display: block;
      margin-bottom: 4px;
    }

    .service-detail {
      font-size: 10pt;
      color: #374151;
      white-space: pre-wrap;
      word-wrap: break-word;
      background-color: #f9fafb;
      padding: 6px 10px;
      border-radius: 4px;
      border-left: 3px solid #93c5fd;
      margin-top: 4px;
      display: block;
    }

    .service-price {
      font-weight: 700;
      color: #1e3a8a;
      text-align: right;
      white-space: nowrap;
      display: block;
    }

    .total-row td {
      background-color: #ffffff;
      padding: 10px 12px;
      font-weight: 700;
      color: #1e3a8a;
      font-size: 14pt;
    }
    .total-row .total-label {
      text-align: left;
    }
    .total-row .total-value {
      text-align: right;
      white-space: nowrap;
    }

    .footer {
      margin-top: 40px;
      font-size: 9pt;
      color: #6b7280;
      border-top: 1px solid #d1d5db;
      padding-top: 12px;
      text-align: center;
    }
    .footer p {
      margin: 2px 0;
    }

    @media print {
      body { padding: 0; }
      .pdf-container { margin: 0; }
    }
  </style>
</head>
<body>
<div class="pdf-container">
  <div class="header">
    <h1>actols</h1>
    <span class="badge">Cotización</span>
  </div>
  <div class="divider"></div>

  <div class="client-info">
    <p><strong>Cliente:</strong> {{clientName}}</p>
    <p><strong>Producto o servicio:</strong> {{productName}}</p>
    <p><strong>Fecha:</strong> {{date}}</p>
  </div>
  <div class="divider"></div>

  <table class="services-table">
    <thead>
      <tr>
        <th>Servicio</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody>
      {{servicesRows}}
      <tr class="total-row">
        <td class="total-label">Total</td>
        <td class="total-value">{{total}}</td>
      </tr>
    </tbody>
  </table>

  <div class="footer">
    <p>Esta cotización es válida por 30 días.</p>
    <p>powered by actols</p>
  </div>
</div>
</body>
</html>
