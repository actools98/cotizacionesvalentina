name: Deploy a GitHub Pages

on:
  push:
    branches: [ "main" ]   # Cambia a "master" si usas master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22        # <--- Cambiado a 22 para evitar deprecated
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install          # <--- CAMBIADO: antes era npm ci

      - name: Construir proyecto
        run: npm run build

      - name: Subir artefacto (carpeta dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
