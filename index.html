<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo caducada</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      text-align: center;
      padding: 1rem;
    }
    .container {
      max-width: 600px;
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #f87171;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: #cbd5e1;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏰ Demo caducada</h1>
    <p>El período de prueba de 15 días ha finalizado.<br>Para continuar usando el cotizador, contacta con soporte.</p>
    <a href="mailto:info@actols.com" class="btn">Contactar soporte</a>
  </div>
</body>
</html>
